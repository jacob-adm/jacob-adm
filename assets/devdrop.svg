<svg xmlns="http://www.w3.org/2000/svg" width="420" height="172" viewBox="0 0 420 172"><rect x="0.5" y="0.5" width="419" height="171" rx="10" fill="#ffffff" stroke="#d1d9e0"/><rect x="0.5" y="0.5" width="5" height="171" rx="2" fill="#0F6378"/><text x="22" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#1f2328">devdrop</text><text x="22" y="60" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#59636e">Installs one Android or iOS build on every attached</text><text x="22" y="79" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#59636e">phone, tablet, emulator and simulator, and skips any</text><text x="22" y="98" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#59636e">device the build cannot run on, with the reason.</text><rect x="22" y="110" width="376" height="24" rx="5" fill="#f6f8fa"/><text x="32" y="127" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#1f2328">pip install git+https://github.com/jacob-adm/devdrop</text><rect x="22" y="142" width="51" height="20" rx="10" fill="#e6f2f4"/><text x="47.5" y="156" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F6378">JUnit</text><rect x="79" y="142" width="44" height="20" rx="10" fill="#e6f2f4"/><text x="101.0" y="156" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F6378">JSON</text><rect x="129" y="142" width="37" height="20" rx="10" fill="#e6f2f4"/><text x="147.5" y="156" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F6378">adb</text><re