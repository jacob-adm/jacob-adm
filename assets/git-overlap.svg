<svg xmlns="http://www.w3.org/2000/svg" width="420" height="172" viewBox="0 0 420 172"><rect x="0.5" y="0.5" width="419" height="171" rx="10" fill="#ffffff" stroke="#d1d9e0"/><rect x="0.5" y="0.5" width="5" height="171" rx="2" fill="#0F6378"/><text x="22" y="34" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#1f2328">git-overlap</text><text x="22" y="60" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#59636e">Shows which branches will conflict before any merge,</text><text x="22" y="79" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#59636e">including uncommitted work in worktrees.</text><rect x="22" y="110" width="376" height="24" rx="5" fill="#f6f8fa"/><text x="32" y="127" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#1f2328">pip install git-overlap</text><rect x="22" y="142" width="44" height="20" rx="10" fill="#e6f2f4"/><text x="44.0" y="156" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F6378">JSON</text><rect x="72" y="142" width="37" height="20" rx="10" fill="#e6f2f4"/><text x="90.5" y="156" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F6378">TSV</text><rect x="115" y="142" width="37" height="20" rx="10" fill="#e6f2f4"/><text x="133.5" y="156" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#0F6378">git</text></svg>
